<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JBD Inventory & JESSA PO Tracker</title>
<!-- React & Babel CDNs -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
body { font-family: 'Inter', sans-serif; }
@media print {
.no-print { display: none !important; }
.print-only { display: block !important; }
body { background: white; color: black; }
}
</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
<div id="root">
<!-- Initial Loading Indicator -->
<div class="min-h-screen flex items-center justify-center bg-slate-900 text-white font-sans p-4">
<div class="text-center space-y-3">
<div class="inline-block animate-spin text-3xl text-indigo-500">
<i class="fa-solid fa-circle-notch"></i>
</div>
<h2 class="text-xl font-bold">Loading JBD & JESSA Tracker...</h2>
<p class="text-xs text-slate-400">Connecting to database...</p>
</div>
</div>
</div>

<!-- Firebase SDK Modular Scripts -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import {
getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// =========================================================================
// CAREFULLY PASTE YOUR FIREBASE KEYS INSIDE THE QUOTES BELOW
// Do not delete the quotes "" or the commas , at the end of the lines!
// =========================================================================
const firebaseConfig = {
apiKey: "AIzaSyAGuV3oqPzHKoB0-p9S7oFDpLYHL88c9OE",
authDomain: "PASTE_YOUR_AUTH_DOMAIN_HERE",
projectId: "PASTE_YOUR_PROJECT_ID_HERE",
storageBucket: "PASTE_YOUR_STORAGE_BUCKET_HERE",
messagingSenderId: "PASTE_YOUR_SENDER_ID_HERE",
appId: "PASTE_YOUR_APP_ID_HERE"
};

try {
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.FB = { app, auth, db, signInAnonymously, onAuthStateChanged, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query };
window.dispatchEvent(new Event('firebase-ready'));
} catch (e) {
console.error("Firebase init failed, falling back to local mode:", e);
window.FB = null;
window.dispatchEvent(new Event('firebase-ready'));
}
</script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// Fallback Local Storage Data if Firestore is disconnected
const FALLBACK_INVENTORY = [
{ id: 'inv-1', sku: 'TSHIRT-BLK-M', name: 'Black Unisex T-Shirt (M)', category: 'Apparel', stock: 45, reorderPoint: 10, unitCost: 4.50, sellingPrice: 22.00, vendor: 'Alpha Prints' }
 ];
const FALLBACK_ORDERS = [
{ id: 'ORD-1001', orderNumber: 'JESSA-ORD-1001', customerOrVendor: 'Local Winter Market', type: 'SALE', status: 'Fulfilled', date: '2026-08-10', notes: 'Example order', items: [], totalAmount: 180.00 }
];

function App() {
const [fbReady, setFbReady] = useState(false);
const [user, setUser] = useState(null);
const [activeTab, setActiveTab] = useState('dashboard');

const [inventory, setInventory] = useState([]);
const [orders, setOrders] = useState([]);
const [loading, setLoading] = useState(true);

// Filter & Modal States
const [searchQuery, setSearchQuery] = useState('');
const [orderSearchQuery, setOrderSearchQuery] = useState('');
const [categoryFilter, setCategoryFilter] = useState('All');
const [editingItem, setEditingItem] = useState(null);
const [isItemModalOpen, setIsItemModalOpen] = useState(null);
const [editingOrder, setEditingOrder] = useState(null);
const [selectedOrderForInvoice, setSelectedOrderForInvoice] = useState(null);
const [notification, setNotification] = useState(null);

const showToast = (message, type = 'success') => {
setNotification({ message, type });
setTimeout(() => setNotification(null), 3500);
};

// 1. Wait for Firebase script to finish loading safely
useEffect(() => {
if (window.FB) {
setFbReady(true);
} else {
const handleReady = () => setFbReady(true);
window.addEventListener('firebase-ready', handleReady);
return () => window.removeEventListener('firebase-ready', handleReady);
}
}, []);

// 2. Initialize Auth once Firebase is Ready
useEffect(() => {
if (!fbReady) return;

const initAuth = async () => {
if (!window.FB || !window.FB.auth) {
const savedInv = localStorage.getItem('jbd_inventory');
const savedOrd = localStorage.getItem('jbd_orders');
setInventory(savedInv ? JSON.parse(savedInv) : FALLBACK_INVENTORY);
setOrders(savedOrd ? JSON.parse(savedOrd) : FALLBACK_ORDERS);
setLoading(false);
return;
}

const { auth, signInAnonymously, onAuthStateChanged } = window.FB;

try {
await signInAnonymously(auth);
} catch (err) {
console.warn("Auth fallback warning:", err);
}

onAuthStateChanged(auth, (u) => {
setUser(u);
});
};

initAuth();
}, [fbReady]);

// 3. Real-time Firestore Sync
useEffect(() => {
if (!fbReady) return;

if (!window.FB || !window.FB.db) {
setLoading(false);
return;
}

const { db, collection, onSnapshot, query } = window.FB;

const invColRef = collection(db, 'inventory');
const ordColRef = collection(db, 'orders');

const unsubInv = onSnapshot(query(invColRef),
(snapshot) => {
const invList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
setInventory(invList.length > 0 ? invList : []);
setLoading(false);
},
(err) => {
console.warn("Firestore Inventory error:", err);
const savedInv = localStorage.getItem('jbd_inventory');
setInventory(savedInv ? JSON.parse(savedInv) : FALLBACK_INVENTORY);
setLoading(false);
}
);

const unsubOrd = onSnapshot(query(ordColRef),
(snapshot) => {
const ordList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
setOrders(ordList.length > 0 ? ordList : []);
},
(err) => {
console.warn("Firestore Orders error:", err);
const savedOrd = localStorage.getItem('jbd_orders');
setOrders(savedOrd ? JSON.parse(savedOrd) : FALLBACK_ORDERS);
}
);

return () => {
unsubInv();
unsubOrd();
};
}, [fbReady, user]);

useEffect(() => { if (inventory.length > 0) localStorage.setItem('jbd_inventory', JSON.stringify(inventory)); }, [inventory]);
useEffect(() => { if (orders.length > 0) localStorage.setItem('jbd_orders', JSON.stringify(orders)); }, [orders]);

const handleSaveItem = async (itemData) => {
const itemId = itemData.id || inv-${Date.now()}`;
const payload = { ...itemData, id: itemId };

if (window.FB && window.FB.db) {
const { db, doc, setDoc } = window.FB;
const itemRef = doc(db, 'inventory', itemId);
await setDoc(itemRef, payload, { merge: true });
} else {
setInventory(prev => {
const exists = prev.some(i => i.id === itemId);
return exists ? prev.map(i => i.id === itemId ? payload : i) : [payload, ...prev];
});
}
showToast(itemData.id ? Updated "${itemData.name}":Added "${itemData.name}");
setIsItemModalOpen(null);
setEditingItem(null);
};

const handleQuickStockAdjust = async (itemId, delta) => {
const targetItem = inventory.find(i => i.id === itemId);
if (!targetItem) return;
const newStock = Math.max(0, (targetItem.stock || 0) + delta);

if (window.FB && window.FB.db) {
const { db, doc, updateDoc } = window.FB;
const invRef = doc(db, 'inventory', itemId);
await updateDoc(invRef, { stock: newStock });
} else {
setInventory(prev => prev.map(i => i.id === itemId ? { ...i, stock: newStock } : i));
}
showToast(Updated stock for${targetItem.name}: ${newStock});
};

const handleDeleteItem = async (id) => {
if (!confirm("Are you sure you want to delete this inventory item?")) return;
if (window.FB && window.FB.db) {
const { db, doc, deleteDoc } = window.FB;
const itemRef = doc(db, 'inventory', id);
await deleteDoc(itemRef);
} else {
setInventory(prev => prev.filter(i => i.id !== id));
}
showToast("Item removed", "info");
};

const revertOrderStockEffect = async (order) => {
const isActive = order.status === 'Committed' || order.status === 'Fulfilled';
if (!isActive) return;
const revertMultiplier = order.type === 'SALE' ? 1 : -1;

for (let line of order.items) {
const invItem = inventory.find(i => i.id === line.itemId);
if (invItem) {
const revertedStock = Math.max(0, (invItem.stock || 0) + (line.qty * revertMultiplier));
if (window.FB && window.FB.db) {
const { db, doc, updateDoc } = window.FB;
await updateDoc(doc(db, 'inventory', invItem.id), { stock: revertedStock });
}
}
}
};

const applyOrderStockEffect = async (order) => {
const isActive = order.status === 'Committed' || order.status === 'Fulfilled';
if (!isActive) return;
const applyMultiplier = order.type === 'SALE' ? -1 : 1;

for (let line of order.items) {
const invItem = inventory.find(i => i.id === line.itemId);
if (invItem) {
const newStock = Math.max(0, (invItem.stock || 0) + (line.qty * applyMultiplier));
if (window.FB && window.FB.db) {
const { db, doc, updateDoc } = window.FB;
await updateDoc(doc(db, 'inventory', invItem.id), { stock: newStock });
}
}
}
};

const handleUpdateOrderStatus = async (orderId, newStatus) => {
const targetOrder = orders.find(o => o.id === orderId);
if (!targetOrder || targetOrder.status === newStatus) return;

await revertOrderStockEffect(targetOrder);
const updatedOrder = { ...targetOrder, status: newStatus };
await applyOrderStockEffect(updatedOrder);

if (window.FB && window.FB.db) {
const { db, doc, updateDoc } = window.FB;
await updateDoc(doc(db, 'orders', orderId), { status: newStatus });
}
showToast(Order status updated);
};

const handleSaveOrder = async (orderData, autoCommit = true) => {
const orderId = orderData.id || ord-${Date.now()}; let orderNumber = orderData.orderNumber || (orderData.type === 'SALE' ?SALE-{Math.floor(1000 + Math.random() * 9000)}`);

const existingOrder = orders.find(o => o.id === orderId);
if (existingOrder) await revertOrderStockEffect(existingOrder);

const finalStatus = autoCommit ? 'Fulfilled' : (orderData.status || 'Draft');
const fullOrder = { ...orderData, id: orderId, orderNumber, status: finalStatus, date: orderData.date || new Date().toISOString().split('T')[0] };

if (window.FB && window.FB.db) {
const { db, doc, setDoc } = window.FB;
await setDoc(doc(db, 'orders', orderId), fullOrder);
} else {
setOrders(prev => prev.some(o => o.id === orderId) ? prev.map(o => o.id === orderId ? fullOrder : o) : [fullOrder, ...prev]);
}

await applyOrderStockEffect(fullOrder);
showToast(Saved transaction #${orderNumber}`);
setEditingOrder(null);
setActiveTab('orders');
};

const handleDeleteOrder = async (orderId) => {
const targetOrder = orders.find(o => o.id === orderId);
if (!targetOrder) return;
if (!confirm(Delete${targetOrder.orderNumber}? Stock will be restored.`)) return;

await revertOrderStockEffect(targetOrder);

if (window.FB && window.FB.db) {
const { db, doc, deleteDoc } = window.FB;
await deleteDoc(doc(db, 'orders', orderId));
} else {
setOrders(prev => prev.filter(o => o.id !== orderId));
}
showToast(Deleted ${targetOrder.orderNumber}`, "info");
};

const categories = useMemo(() => ['All', ...new Set(inventory.map(i => i.category || 'General'))], [inventory]);
const metrics = useMemo(() => {
const totalStockItems = inventory.reduce((acc, i) => acc + (Number(i.stock) || 0), 0);
const totalInventoryValuationCost = inventory.reduce((acc, i) => acc + ((Number(i.stock) || 0) * (Number(i.unitCost) || 0)), 0);
const lowStockCount = inventory.filter(i => i.stock <= (i.reorderPoint || 5)).length;

const totalSalesRevenue = orders.filter(o => o.type === 'SALE' && o.status !== 'Cancelled').reduce((acc, o) => acc + (o.totalAmount || 0), 0);
const totalCOGSSold = orders.filter(o => o.type === 'SALE' && o.status !== 'Cancelled').reduce((acc, o) => acc + (o.items || []).reduce((s, item) => s + ((item.unitCost || 0) * item.qty), 0), 0);
const netRealizedProfit = totalSalesRevenue - totalCOGSSold;

return { totalStockItems, totalInventoryValuationCost, lowStockCount, totalSalesRevenue, netRealizedProfit };
}, [inventory, orders]);

if (loading) {
return (
<div className="min-h-screen flex items-center justify-center bg-slate-900 text-white font-sans p-4">
<div className="text-center space-y-3">
<div className="inline-block animate-spin text-3xl text-indigo-500"><i className="fa-solid fa-circle-notch"></i></div>
<h2 className="text-xl font-bold">Connecting React Interface...</h2>
</div>
</div>
);
}

return (
<div className="min-h-screen flex flex-col md:flex-row">
{notification && (
<div className={fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg text-white font-medium flex items-center gap-2${notification.type === 'info' ? 'bg-blue-600' : 'bg-emerald-600'}`}>
<i className="fa-solid fa-circle-check"></i> {notification.message}
</div>
)}

<aside className="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between no-print shrink-0">
<div>
<div className="p-5 border-b border-slate-800">
<div className="flex items-center gap-3">
<div className="bg-gradient-to-tr from-indigo-500 to-emerald-400 p-2.5 rounded-xl text-white font-bold text-lg">JB</div>
<div>
<h1 className="font-bold text-white text-base leading-tight">JBD & JESSA</h1>
<p className="text-xs text-slate-400">Inventory & PO App</p>
</div>
</div>
</div>
<nav className="p-3 space-y-1">
<button onClick={() => { setActiveTab('dashboard'); setEditingOrder(null); }} className={w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800 text-slate-400'}}&gt;&lt;i className="fa-solid fa-chart-pie w-5"&gt;&lt;/i&gt; Dashboard&lt;/button&gt; &lt;button onClick={() =&gt; { setActiveTab('inventory'); setEditingOrder(null); }} className={w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${activeTab === 'inventory' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800 text-slate-400'}}><i className="fa-solid fa-boxes-stacked w-5"></i> Inventory & Profit {metrics.lowStockCount > 0 && <span className="ml-auto bg-amber-500/20 text-amber-300 text-xs px-2 py-0.5 rounded-full font-semibold">{metrics.lowStockCount}</span>}</button>
<button onClick={() => { setActiveTab('orders'); setEditingOrder(null); }} className={w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${activeTab === 'orders' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800 text-slate-400'}}&gt;&lt;i className="fa-solid fa-receipt w-5"&gt;&lt;/i&gt; Orders & POs&lt;/button&gt; &lt;button onClick={() =&gt; { setEditingOrder(null); setActiveTab('new-order'); }} className={w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${activeTab === 'new-order' && !editingOrder ? 'bg-emerald-600 text-white' : 'hover:bg-slate-800 text-emerald-400'}}><i className="fa-solid fa-plus-circle w-5"></i> New Order / Sale</button>
</nav>
</div>
<div className="p-4 m-3 bg-slate-800/60 rounded-xl border border-slate-700/50 text-xs">
<div className="flex justify-between text-slate-400 mb-1"><span>Realized Revenue:</span><span className="font-semibold text-emerald-400">{metrics.netRealizedProfit.toFixed(2)}</span></div>
</div>
</aside>

<main className="flex-1 bg-slate-50 p-4 md:p-8 overflow-y-auto min-h-screen">

{activeTab === 'dashboard' && (
<div className="space-y-6 max-w-7xl mx-auto">
<div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
<div><h2 className="text-2xl font-bold text-slate-900">Unified Business Dashboard</h2><p className="text-slate-500 text-sm">Real-time sync between JBD Inventory and JESSA POs</p></div>
<button onClick={() => { setEditingOrder(null); setActiveTab('new-order'); }} className="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-lg text-sm shadow-sm transition"><i className="fa-solid fa-cart-plus"></i> Create New Transaction</button>
</div>

<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
<div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm"><div className="text-xs font-semibold text-slate-500 uppercase">Sales Revenue</div><div className="text-2xl font-bold text-slate-900 mt-2">{metrics.netRealizedProfit.toFixed(2)}</div></div>
<div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm"><div className="text-xs font-semibold text-slate-500 uppercase">Inventory Value (Cost)</div><div className="text-2xl font-bold text-slate-900 mt-2">$`{metrics.totalInventoryValuationCost.toFixed(2)}</div></div>
<div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm"><div className="text-xs font-semibold text-slate-500 uppercase">Low Stock Alerts</div><div className="text-2xl font-bold text-amber-600 mt-2">{metrics.lowStockCount}</div></div>
</div>

{metrics.lowStockCount > 0 && (
<div className="bg-amber-50/70 border border-amber-200 rounded-xl p-5">
<div className="flex items-center justify-between mb-3">
<div className="flex items-center gap-2 text-amber-800 font-semibold"><i className="fa-solid fa-triangle-exclamation"></i>Attention Needed: Reorder Stock</div>
<button onClick={() => setActiveTab('inventory')} className="text-xs text-amber-800 hover:text-amber-900 font-semibold underline">Manage Inventory</button>
</div>
<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-43">
{inventory.filter(i => i.stock <= (i.reorderPoint || 5)).map(item => (
<div key={item.id} className="bg-white p-3 rounded-lg border border-amber-200 shadow-sm flex items-center justify-between">
<div><div className="font-semibold text-sm text-slate-800">{item.name}</div><div className="text-xs text-slate-400">SKU: {item.sku}</div></div>
<div className="text-right flex items-center gap-2">
<span className="px-2 py-0.5 bg-amber-100 text-amber-800 font-bold rounded text-xs">{item.stock} left</span>
<button onClick={() => handleQuickStockAdjust(item.id, 10)} className="text-xs bg-slate-100 hover:bg-emerald-100 hover:text-emerald-700 px-2 py-1 rounded font-bold">+10</button>
</div>
</div>
))}
</div>
</div>
)}
</div>
)}

{activeTab === 'inventory' && (
<div className="space-y-6 max-w-7xl mx-auto">
<div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
<div><h2 className="text-2xl font-bold text-slate-900">Stock & Profit Tracker</h2></div>
<button onClick={() => { setEditingItem({}); setIsItemModalOpen('create'); }} className="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-lg text-sm">+ Add Item</button>
</div>
<div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-3">
<input type="text" placeholder="Search SKU, Name..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm" />
<select value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)} className="w-full md:w-48 px-3 py-2 bg-slate-50 border rounded-lg text-sm">
{categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
</select>
</div>
<div className="bg-white rounded-xl border shadow-sm overflow-hidden overflow-x-auto">
<table className="w-full text-left text-sm">
<thead className="bg-slate-50 border-b text-xs font-semibold text-slate-500 uppercase">
<tr><th className="p-4">SKU / Name</th><th className="p-4 text-center">Stock</th><th className="p-4 text-right">Cost</th><th className="p-4 text-right">Price</th><th className="p-4 text-right">Margin</th><th className="p-4 text-center">Actions</th></tr>
</thead>
<tbody className="divide-y divide-slate-100">
{inventory.filter(item => (item.name.toLowerCase().includes(searchQuery.toLowerCase()) || item.sku.toLowerCase().includes(searchQuery.toLowerCase())) && (categoryFilter === 'All' || item.category === categoryFilter)).map(item => (
<tr key={item.id} className="hover:bg-slate-50">
<td className="p-4"><div className="font-bold">{item.name}</div><div className="text-xs text-slate-400">{item.sku}</div></td>
<td className="p-4 text-center">
<div className="inline-flex items-center gap-2">
<button onClick={() => handleQuickStockAdjust(item.id, -1)} className="w-6 h-6 border bg-white rounded font-bold">-</button>
<span className="font-bold w-6">{item.stock}</span>
<button onClick={() => handleQuickStockAdjust(item.id, 1)} className="w-6 h-6 border bg-white rounded font-bold">+</button>
</div>
</td>
<td className="p-4 text-right">${Number(item.unitCost).toFixed(2)}&lt;/td&gt; &lt;td className="p-4 text-right font-bold"&gt;${Number(item.sellingPrice).toFixed(2)}</td>
<td className="p-4 text-right text-emerald-600 font-bold">`${(item.sellingPrice - item.unitCost).toFixed(2)}</td>
<td className="p-4 text-center">
<button onClick={() => { setEditingItem(item); setIsItemModalOpen('edit'); }} className="p-1.5 text-indigo-600"><i className="fa-solid fa-pen"></i></button>
<button onClick={() => handleDeleteItem(item.id)} className="p-1.5 text-rose-600"><i className="fa-solid fa-trash"></i></button>
</td>
</tr>
))}
</tbody>
</table>
</div>
</div>
)}

{activeTab === 'orders' && (
<div className="space-y-6 max-w-7xl mx-auto">
<div className="flex justify-between items-center">
<h2 className="text-2xl font-bold text-slate-900">Orders & POs</h2>
<button onClick={() => { setEditingOrder(null); setActiveTab('new-order'); }} className="bg-emerald-600 text-white px-4 py-2.5 rounded-lg text-sm font-semibold">+ Create</button>
</div>
<div className="space-y-4">
{orders.map(order => (
<div key={order.id} className="bg-white rounded-xl border p-5 shadow-sm">
<div className="flex justify-between items-center border-b pb-3 mb-3">
<div><h3 className="font-bold">{order.orderNumber} ({order.type})</h3><p className="text-xs text-slate-500">{order.customerOrVendor} • {order.date}</p></div>
<div className="flex gap-2">
<select value={order.status} onChange={(e) => handleUpdateOrderStatus(order.id, e.target.value)} className="text-xs border px-2 py-1 rounded">
<option value="Draft">Draft</option><option value="Committed">Committed</option><option value="Fulfilled">Fulfilled</option><option value="Cancelled">Cancelled</option>
</select>
<button onClick={() => { setEditingOrder(order); setActiveTab('new-order'); }} className="px-3 py-1 bg-indigo-50 text-indigo-700 text-xs rounded">Edit</button>
<button onClick={() => handleDeleteOrder(order.id)} className="px-3 py-1 bg-rose-50 text-rose-700 text-xs rounded">Delete</button>
</div>
</div>
<div className="bg-slate-50 p-3 rounded text-xs">
{order.items.map((line, idx) => <div key={idx} className="flex justify-between"><span>{line.name} x{line.qty}</span><span className="font-bold">latex
{(line.qty * line.unitPrice).toFixed(2)}&lt;/span&gt;&lt;/div&gt;)} &lt;/div&gt; &lt;div className="text-right font-bold mt-2"&gt;Total: 

{order.totalAmount.toFixed(2)}</div>
</div>
))}
</div>
</div>
)}

{activeTab === 'new-order' && (
<NewOrEditOrderForm existingOrder={editingOrder} inventory={inventory} onSubmitOrder={handleSaveOrder} onCancel={() => { setEditingOrder(null); setActiveTab('orders'); }} />
)}
</main>

{isItemModalOpen && <InventoryModal item={editingItem} onClose={() => setIsItemModalOpen(null)} onSave={handleSaveItem} />}
</div>
);
}

function NewOrEditOrderForm({ existingOrder, inventory, onSubmitOrder, onCancel }) {
const [orderType, setOrderType] = useState(existingOrder?.type || 'SALE');
const [customerOrVendor, setCustomerOrVendor] = useState(existingOrder?.customerOrVendor || '');
const [notes, setNotes] = useState(existingOrder?.notes || '');
const [cart, setCart] = useState(existingOrder?.items || []);

const handleAddToCart = (item) => {
const existing = cart.find(c => c.itemId === item.id);
if (existing) setCart(cart.map(c => c.itemId === item.id ? { ...c, qty: c.qty + 1 } : c));
else setCart([...cart, { itemId: item.id, sku: item.sku, name: item.name, qty: 1, unitPrice: orderType === 'SALE' ? item.sellingPrice : item.unitCost, unitCost: item.unitCost }]);
};
const handleUpdateQty = (id, qty) => setCart(cart.map(c => c.itemId === id ? { ...c, qty: Math.max(1, Number(qty)) } : c));
const totalAmount = cart.reduce((sum, i) => sum + (i.qty * i.unitPrice), 0);

const handleSubmit = (commit) => {
if (!customerOrVendor) return alert("Enter customer/vendor");
onSubmitOrder({ id: existingOrder?.id, orderNumber: existingOrder?.orderNumber, type: orderType, customerOrVendor, notes, items: cart, totalAmount, status: existingOrder?.status || 'Draft' }, commit);
};

return (
<div className="bg-white rounded-xl border p-6 space-y-6 max-w-4xl mx-auto">
<h2 className="text-xl font-bold">{existingOrder ? 'Edit Transaction' : 'New Transaction'}</h2>
<div className="flex gap-2">
<button onClick={() => setOrderType('SALE')} className={px-4 py-2 rounded text-sm font-bold ${orderType === 'SALE' ? 'bg-emerald-600 text-white' : 'bg-slate-100'}}&gt;SALE (Deduct Stock)&lt;/button&gt; &lt;button onClick={() =&gt; setOrderType('PURCHASE')} className={px-4 py-2 rounded text-sm font-bold ${orderType === 'PURCHASE' ? 'bg-blue-600 text-white' : 'bg-slate-100'}}>PO (Add Stock)</button>
</div>
<input type="text" placeholder="Customer or Vendor Name" value={customerOrVendor} onChange={e => setCustomerOrVendor(e.target.value)} className="w-full p-2 border rounded" />

<div className="grid grid-cols-2 md:grid-cols-3 gap-2 p-2 bg-slate-50 border rounded max-h-48 overflow-y-auto">
{inventory.map(item => (
<button key={item.id} onClick={() => handleAddToCart(item)} className="p-2 bg-white border rounded text-left text-xs font-bold hover:border-indigo-500">{item.name} (Stock: {item.stock})</button>
))}
</div>

<div className="border rounded p-2">
{cart.map(line => (
<div key={line.itemId} className="flex justify-between items-center py-2 border-b text-sm">
<span className="font-bold">{line.name}</span>
<div className="flex items-center gap-2">
Qty: <input type="number" value={line.qty} onChange={e => handleUpdateQty(line.itemId, e.target.value)} className="w-16 p-1 border rounded text-center" />
<button onClick={() => setCart(cart.filter(c => c.itemId !== line.itemId))} className="text-rose-600 px-2">X</button>
</div>
</div>
))}
<div className="text-right font-bold pt-2 text-lg">Total: $`{totalAmount.toFixed(2)}</div>
</div>
<div className="flex justify-end gap-2">
<button onClick={onCancel} className="px-4 py-2 bg-slate-200 rounded font-bold">Cancel</button>
<button onClick={() => handleSubmit(true)} className="px-4 py-2 bg-indigo-600 text-white rounded font-bold">Save & Sync</button>
</div>
</div>
);
}

function InventoryModal({ item, onClose, onSave }) {
const [form, setForm] = useState({ id: item?.id || '', sku: item?.sku || '', name: item?.name || '', category: item?.category || 'General', stock: item?.stock || 0, reorderPoint: item?.reorderPoint || 5, unitCost: item?.unitCost || 0, sellingPrice: item?.sellingPrice || 0 });
return (
<div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
<div className="bg-white p-6 rounded-xl w-full max-w-md space-y-4">
<h3 className="font-bold">{item?.id ? 'Edit Item' : 'New Item'}</h3>
<input type="text" placeholder="Name" value={form.name} onChange={e => setForm({...form, name: e.target.value})} className="w-full p-2 border rounded" />
<div className="grid grid-cols-2 gap-2">
<input type="text" placeholder="SKU" value={form.sku} onChange={e => setForm({...form, sku: e.target.value})} className="w-full p-2 border rounded" />
<input type="text" placeholder="Category" value={form.category} onChange={e => setForm({...form, category: e.target.value})} className="w-full p-2 border rounded" />
<input type="number" placeholder="Stock" value={form.stock} onChange={e => setForm({...form, stock: Number(e.target.value)})} className="w-full p-2 border rounded" />
<input type="number" placeholder="Cost `$" step="0.01" value={form.unitCost} onChange={e => setForm({...form, unitCost: Number(e.target.value)})} className="w-full p-2 border rounded" />
<input type="number" placeholder="Price $" step="0.01" value={form.sellingPrice} onChange={e => setForm({...form, sellingPrice: Number(e.target.value)})} className="w-full p-2 border rounded" />
</div>
<div className="flex justify-end gap-2 pt-4">
<button onClick={onClose} className="px-4 py-2 bg-slate-200 rounded">Cancel</button>
<button onClick={() => onSave(form)} className="px-4 py-2 bg-indigo-600 text-white rounded">Save</button>
</div>
</div>
</div>
);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
